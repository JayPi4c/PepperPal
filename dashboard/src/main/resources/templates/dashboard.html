<!DOCTYPE html>
<html lang="en" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/ico" th:href="@{../favicon.ico}">
    <title>Chili Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="/webjars/chart.js/4.5.1/dist/chart.umd.js"></script>
    <script src="/webjars/moment/moment.js"></script>
    <script src="webjars/chartjs-adapter-moment/dist/chartjs-adapter-moment.js"></script>

    <script src="/js/app.js" type="text/javascript"></script>

    <style>
        /* Essential constraint for Chart.js responsiveness within Bootstrap grids */
        .chart-container {
            position: relative;
            height: 40vh;
            min-height: 300px;
            width: 100%;
        }
    </style>
</head>
<body class="bg-body-tertiary">

<nav class="navbar navbar-expand-lg bg-body shadow-sm mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">🌶️ Chili Dashboard</span>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm" id="toggleMoisture">Show/Hide Moisture</button>
            <button class="btn btn-outline-primary btn-sm" id="toggleTheme">🌓 Theme</button>
        </div>
    </div>
</nav>

<div class="container-fluid px-4">

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form id="updateForm" class="row gy-3 gx-4 align-items-end">
                <div class="col-12 col-md-auto flex-grow-1">
                    <label for="start" class="form-label fw-bold text-secondary mb-1">Start datetime:</label>
                    <input type="datetime-local" class="form-control" id="start" name="start" required>
                </div>
                <div class="col-12 col-md-auto flex-grow-1">
                    <label for="end" class="form-label fw-bold text-secondary mb-1">End datetime:</label>
                    <input type="datetime-local" class="form-control" id="end" name="end" required>
                </div>
                <div class="col-12 col-md-auto">
                    <button type="submit" class="btn btn-primary w-100" id="makeRequest">
                        Update Data
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-12 d-none" id="moisture_wrapper">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title text-secondary">Soil Moisture</h5>
                    <div class="chart-container">
                        <canvas id="moisture_chart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12" id="temp_humid_wrapper">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title text-secondary">Temperature & Humidity</h5>
                    <div class="chart-container">
                        <canvas id="temp_humid_chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="loadingOverlay"
     class="position-fixed top-0 left-0 w-100 h-100 d-none justify-content-center align-items-center"
     style="background-color: rgba(0,0,0,0.4); z-index: 9999;">
    <div class="spinner-border text-light" style="width: 4rem; height: 4rem;" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

</body>
</html>
